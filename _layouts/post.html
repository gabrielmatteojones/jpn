---
layout: default
---

<div class="container my-5">
  <article class="card shadow-lg">
    {% if page.image %}
    <img src="{{ page.image }}" class="card-img-top" alt="{{ page.title }}">
    {% endif %}

    <div class="card-body">
      <h1 class="card-title display-4">{{ page.title }}</h1>
      <p class="text-muted">
        <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %d, %Y" }}</time>
        {% if page.author %} | by {{ page.author }}{% endif %}
      </p>

      <div class="card-text mt-4">
        {{ content }}
      </div>
    </div>

    <div class="card-footer bg-white">
      <p class="mb-2">Condividi questo post:</p>
      <div class="d-flex gap-3">
        <a href="https://twitter.com/intent/tweet?url={{ page.url | absolute_url }}" target="_blank" class="btn btn-outline-primary btn-sm">
          Twitter
        </a>
        <a href="https://www.facebook.com/sharer/sharer.php?u={{ page.url | absolute_url }}" target="_blank" class="btn btn-outline-primary btn-sm">
          Facebook
        </a>
        <a href="https://www.linkedin.com/shareArticle?mini=true&url={{ page.url | absolute_url }}" target="_blank" class="btn btn-outline-primary btn-sm">
          LinkedIn
        </a>
      </div>
    </div>
  </article>
</div>
