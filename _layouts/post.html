---
layout: default
---
    {% if page.title %}
      <h1 class="text-4xl font-extrabold tracking-tight text-gray-900 mb-4">
        {{ page.title }}
      </h1>
    {% endif %}

    <!-- Metadata -->
    {% if page.date %}
      <p class="text-sm text-gray-500 mb-10">
        Pubblicato il {{ page.date | date: "%d %B %Y" }}
      </p>
    {% endif %}

    <!-- Contenuto -->
    <div class="prose prose-lg prose-gray max-w-none leading-relaxed">
      {{ content }}
    </div>
